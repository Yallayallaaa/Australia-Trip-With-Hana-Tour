function pkgHTML(){const d=n=>md(addD(START,n));return `<div class="card"><h3>📋 패키지 확정 정보</h3><p class="pk">✈️ <b>${d(0)}</b> 19:10 인천 출발 KE0401 → <b>${d(1)}</b> 07:20 시드니 도착<br>✈️ <b>${d(4)}</b> 09:20 시드니 출발 VA 511 → 09:40 골드코스트 도착<br>✈️ <b>${d(6)}</b> 08:40 브리즈번 출발 KE0408 → 17:45 인천 도착</p><p class="pk">🏨 2~4일차(3박) 오크스 시드니 노스 라이드 스위트 4성급<br>🏨 5~6일차(2박) 리지 골드 코스트 에어포트 4성급<br>(1일차는 기내, 7일차는 숙박 없음)</p><p class="pk">🍽️ 특식: 2일차 중식 팔레 로얄 부티크 호텔 레스토랑(양식) · 4일차 중식 하버프론트 레스토랑 · 5일차 중식 열대과일농장 BBQ · 6일차 석식 스테이크<br>5일차 조식은 콜드밀박스(스낵·음료)</p><p class="pk">🛍️ 쇼핑센터 총 3회: 4일차 2회 · 6일차 1회 (각 약 1시간)</p><p class="pk">🎟️ 포함: 시닉월드 4종(스카이웨이·레일웨이·워크웨이·케이블웨이) · 오페라하우스 내부 투어 · 골드코스트 헬기투어(스페셜 포함)</p><p class="pk">💰 선택관광(상품가 불포함, 미참여 불이익 없음)<br>· 시드니 야경 투어 70AUD (${d(3)}, 약 2시간, 4명 이상, 우천 취소 가능)<br>· 골드코스트 샴페인 크루즈 70AUD (${d(5)}, 약 1시간, 8명 이상, 우천 취소 가능)<br>출발 7일 미만 시점의 사전 신청은 현지 확정이 아니라서, 도착 후 가이드에게 확인하세요.</p><small>하나투어 최종 일정 기준 · 현지 사정에 따라 변경될 수 있어요</small></div>`}
function info(){document.getElementById("info").innerHTML=`<div class="hero"><div class="label">TRAVEL INFO</div><h2>여행정보</h2></div>${pkgHTML()}<div class="card"><h3>🚨 긴급전화</h3><p><b>000</b> 경찰 · 구급차 · 소방</p><p>휴대전화에서는 112로도 Triple Zero operator에 연결할 수 있습니다.</p><small>Tourism Australia 공식 안내</small></div><div class="card"><h3>🇰🇷 대한민국 총영사관</h3><p><b>시드니</b><br>Level 10, 44 Market Street, Sydney NSW 2000<br>+61 2 9210 0200</p><p><b>퀸즐랜드</b><br>Level 1, 102 Adelaide Street, Brisbane QLD<br>07 3221 1440</p><small>Australian Government DFAT 공식 정보</small></div><div class="card"><h3>🎒 준비물</h3>${["여권","여행자보험","호주용 어댑터","보조배터리","상비약","편한 신발","우천 대비품","선글라스/모자","해외사용 카드","eSIM/로밍"].map((x,i)=>`<label class="check"><input id="c${i}" type="checkbox" onchange="save()"> ${x}</label>`).join("")}</div><div class="alert">호주 해변에서는 가능하면 순찰 해변을 이용하고 빨간색·노란색 깃발 구역에서 수영하세요.</div>`;document.querySelectorAll("[id^=c]").forEach(x=>x.checked=localStorage.getItem(x.id)==="1")}
function save(){document.querySelectorAll("[id^=c]").forEach(x=>localStorage.setItem(x.id,x.checked?"1":"0"))}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));if(v==="schedule")schedule();if(v==="map")mapView();if(v==="weather"){document.getElementById("weather").innerHTML='<div class="hero"><h2>🌤️ 현지 날씨</h2><p>'+md(START)+'~'+md(addD(START,D.length-1))+' 예보</p></div><div class="card" id="wm">불러오는 중…</div>';weather("wm")}if(v==="info")info();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
{const _sh=show;show=function(v){CUR=v;_sh(v);if(v==="outfit")outfitView(OI==null?dayIndex():OI)}}
{const _s=schedule,_h=home,_d=mapDay;schedule=function(i){_s(i);hydratePhotos();hydrateMaps()};home=function(){_h();hydratePhotos()};mapDay=function(i){_d(i);hydratePhotos();hydrateMaps()}}
home();schedule();mapView();info();
