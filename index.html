const map=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function dayIndex(){let k=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());let i=D.findIndex(x=>x[1]===k.slice(5).replace("-","/"));return i<0?0:i}
function eventHTML(s){let [t,n,d,q]=s.split("|");return `<div class="event"><div class="time">${t||"일정"}</div><h3>${n}</h3><p>${d}</p>${q?`<a class="btn" target="_blank" href="${map(q)}">🗺️ 지도</a>`:""}</div>`}
function schedule(i=dayIndex()){let route=ROUTES[i],recs=RECS[i];document.getElementById("schedule").innerHTML=`<div class="pills">${D.map((x,j)=>`<button class="pill ${i==j?"active":""}" onclick="schedule(${j})">${j+1}일차</button>`).join("")}</div><div class="hero"><div class="label">DAY ${i+1}</div><h2>${D[i][0]}</h2><div class="muted">${D[i][1]}</div></div><div class="card"><h3>🗺️ 오늘 이동 코스</h3>${routeCard(route)}</div><div class="card"><h3>📋 패키지 일정</h3>${D[i][2].map(eventHTML).join("")}</div><div class="card"><h3>📍 일정 주변 추천</h3><div class="recs">${recs.map(recHTML).join("")}</div><p class="note">추천 장소는 패키지 일정에 포함되지 않을 수 있습니다. 실제 방문 가능 여부는 당일 자유시간·교통·영업시간을 확인하세요.</p></div>`}
function routeCard(r){let directions=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(r.from)}&destination=${encodeURIComponent(r.to)}&waypoints=${r.stops.slice(1,-1).map(encodeURIComponent).join("|")}&travelmode=driving`;return `<div class="routebox"><div class="routehead"><h3>${r.title}</h3><a class="routebtn" target="_blank" href="${directions}">Google 지도에서 경로</a></div><div class="route-line">${r.stops.map((x,i)=>`<div class="stop"><span class="dot"></span><b>${i+1}. ${x}</b>${i<r.stops.length-1?`<small>↓ 다음 일정지로 이동</small>`:"<small>도착</small>"}</div>`).join("")}</div><p class="note">${r.note}</p></div>`}
function recHTML(r){return `<div class="rec"><div class="emoji">${r[0]}</div><div><h4>${r[1]}</h4><span class="tag">${r[3]}</span><p>${r[2]}</p><a target="_blank" href="${map(r[4])}">📍 지도에서 보기</a></div></div>`}
async function weather(id){let el=document.getElementById(id);try{let L=[["시드니",-33.8688,151.2093],["블루마운틴",-33.7148,150.3117],["골드코스트",-28.0167,153.4]],di=dayIndex();let a=await Promise.all(L.map(x=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${x[1]}&longitude=${x[2]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=2026-10-11&end_date=2026-10-17`).then(r=>r.json()).then(d=>[x[0],d])));el.innerHTML='<div class="weather">'+a.map(([n,d])=>{let k=Math.min(di,d.daily.time.length-1);return `<div class="w"><b>${n}</b><div class="temp">${Math.round(d.daily.temperature_2m_max[k])}°</div><small>최저 ${Math.round(d.daily.temperature_2m_min[k])}°<br>강수 ${d.daily.precipitation_probability_max[k]??"-"}%</small></div>`}).join("")+'</div><small>예보: Open-Meteo. 출발 전 최신 예보 재확인.</small>'}catch(e){el.textContent="날씨를 불러오지 못했습니다."}}
function home(){let i=dayIndex(),x=D[i];document.getElementById("home").innerHTML=`<div class="hero"><div class="label">TODAY · DAY ${i+1}</div><h2>${x[0]}</h2><div class="muted">${x[1]} · ${x[2].length}개 일정</div><button class="btn primary" onclick="show('schedule')">오늘 일정 보기</button><button class="btn" onclick="show('map')">오늘 지도</button></div><div class="grid"><div class="mini"><small>여행 기간</small><b>7일</b></div><div class="mini"><small>현재 지역</small><b>${i<5?"Sydney":"Gold Coast"}</b></div></div><div class="card">${x[2].slice(0,6).map(eventHTML).join("")}</div><div class="section-title"></div><div class="card"><h3>🌤 오늘 날씨</h3><div id="hw">불러오는 중…</div></div><div class="alert">패키지 실제 시간·호텔·식사·선택관광은 현지 사정에 따라 변경될 수 있습니다. 하나투어 최종 안내를 우선하세요.</div>`;weather("hw")}
function mapView(){let i=dayIndex();let all=D.flatMap(x=>x[2].map(s=>s.split("|")).filter(a=>a[3]).map(a=>[a[1],a[2],a[3]]));document.getElementById("map").innerHTML=`<div class="hero"><div class="label">MAP</div><h2>일정별 이동 코스</h2><p class="muted">오늘 코스를 먼저 보여주고, 다른 날짜도 바로 선택할 수 있습니다.</p><div class="pills">${D.map((x,j)=>`<button class="pill ${i==j?"active":""}" onclick="mapDay(${j})">${j+1}일</button>`).join("")}</div></div><div id="mapday"></div><div class="card"><h3>🔎 전체 주요 장소</h3><input class="search" placeholder="장소 검색" oninput="this.parentNode.querySelectorAll('.place').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(this.value.toLowerCase())?'flex':'none')">${all.map(a=>`<div class="place"><div>📍</div><div><b>${a[0].replace(/^[^가-힣A-Za-z]+/,"")}</b><small>${a[1]}</small><a class="btn" target="_blank" href="${map(a[2])}">지도 열기</a></div></div>`).join("")}</div>`;mapDay(i)}
function mapDay(i){let el=document.getElementById("mapday");if(!el)return;el.innerHTML=`<div class="card"><div class="label">DAY ${i+1} · ${D[i][1]}</div>${routeCard(ROUTES[i])}<div class="section-title"></div><h3>📍 주변 추천</h3><div class="recs">${RECS[i].map(recHTML).join("")}</div></div>`}
function info(){document.getElementById("info").innerHTML=`<div class="hero"><div class="label">TRAVEL INFO</div><h2>여행정보</h2></div><div class="card"><h3>🚨 긴급전화</h3><p><b>000</b> 경찰 · 구급차 · 소방</p><p>휴대전화에서는 112로도 Triple Zero operator에 연결할 수 있습니다.</p><small>Tourism Australia 공식 안내</small></div><div class="card"><h3>🇰🇷 대한민국 총영사관</h3><p><b>시드니</b><br>Level 10, 44 Market Street, Sydney NSW 2000<br>+61 2 9210 0200</p><p><b>퀸즐랜드</b><br>Level 1, 102 Adelaide Street, Brisbane QLD<br>07 3221 1440</p><small>Australian Government DFAT 공식 정보</small></div><div class="card"><h3>🎒 준비물</h3>${["여권","여행자보험","호주용 어댑터","보조배터리","상비약","편한 신발","우천 대비품","선글라스/모자","해외사용 카드","eSIM/로밍"].map((x,i)=>`<label class="check"><input id="c${i}" type="checkbox" onchange="save()"> ${x}</label>`).join("")}</div><div class="alert">호주 해변에서는 가능하면 순찰 해변을 이용하고 빨간색·노란색 깃발 구역에서 수영하세요.</div>`;document.querySelectorAll("[id^=c]").forEach(x=>x.checked=localStorage.getItem(x.id)==="1")}
function save(){document.querySelectorAll("[id^=c]").forEach(x=>localStorage.setItem(x.id,x.checked?"1":"0"))}
function show(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));if(v==="schedule")schedule();if(v==="map")mapView();if(v==="weather"){document.getElementById("weather").innerHTML='<div class="hero"><h2>🌤️ 현지 날씨</h2><p>10/11~10/17 예보</p></div><div class="card" id="wm">불러오는 중…</div>';weather("wm")}if(v==="info")info();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
home();schedule();mapView();info();
setInterval(()=>document.getElementById("clock").textContent="호주 시드니 현지시간 "+new Date().toLocaleTimeString("ko-KR",{hour12:false,timeZone:"Australia/Sydney"}),1000);
</script></body></html>
